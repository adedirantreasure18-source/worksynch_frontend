<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#107c41"/>
      <stop offset="100%" stop-color="#0b5c30"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent Lines -->
  <path d="M 64 256 H 448 M 256 64 V 448" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="256" cy="256" r="140" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" fill="none"/>

  <!-- Core Dispatch Shield Symbol -->
  <g filter="url(#shadow)">
    <!-- Central Hexagon / Shield -->
    <path d="M 256 96 L 396 168 V 292 C 396 376 256 424 256 424 C 256 424 116 376 116 292 V 168 Z" fill="url(#shieldGrad)"/>
    
    <!-- Emerald Shield Inset -->
    <path d="M 256 122 L 372 182 V 286 C 372 354 256 394 256 394 C 256 394 140 354 140 286 V 182 Z" fill="#107c41"/>

    <!-- Dynamic Route Dispatch Lightning & Pin -->
    <path d="M 264 164 L 194 268 H 250 L 242 344 L 318 240 H 262 Z" fill="#ffffff"/>
  </g>
</svg>